name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.18.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:operations
      - run: pnpm build:worker && pnpm test:worker-bundle
      - run: pnpm --filter @sollish/realtime build
      - run: pnpm --filter @sollish/realtime test:integration
      - run: pnpm --filter @sollish/realtime test:arena
      - run: pnpm --filter @sollish/realtime test:ringside
      - run: pnpm --filter @sollish/realtime test:contact
      - run: node --test experiments/decision-agent/test/*.test.mjs
      - run: python3 -m unittest discover -s experiments/connectome -p "test_*.py"
      - run: pnpm --filter @sollish/web build:cloudflare
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8791
      - run: pnpm --filter @sollish/web exec playwright install --with-deps chromium
      - name: Browser tests against the production Cloudflare bundle
        run: |
          mkdir -p .tooling
          pnpm --filter @sollish/web preview:cloudflare > .tooling/cloudflare-preview.log 2>&1 &
          SOLLISH_PREVIEW_PID=$!
          trap 'kill "$SOLLISH_PREVIEW_PID" 2>/dev/null || true' EXIT
          SOLLISH_PREVIEW_READY=false
          for SOLLISH_ATTEMPT in $(seq 1 40); do
            if curl --fail --silent http://localhost:3001/game/crash > /dev/null; then
              SOLLISH_PREVIEW_READY=true
              break
            fi
            sleep 1
          done
          test "$SOLLISH_PREVIEW_READY" = true
          PLAYWRIGHT_SKIP_WEBSERVER=true PLAYWRIGHT_BASE_URL=http://localhost:3001 pnpm test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            .tooling/web-screenshots
            .tooling/web-browser-results
            .tooling/cloudflare-preview.log
          retention-days: 7
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.18.2 --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: |
          export PATH="$(pg_config --bindir):$PATH"
          bash supabase/tests/local-postgres.sh
          node --import tsx apps/worker/test/database.integration.ts

  contracts:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy --component rustfmt
      - run: bash scripts/toolchain-setup.sh
      - run: bash scripts/test-contracts.sh
      - run: node packages/onchain/scripts/sync-idl.mjs --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-build-evidence
          path: |
            target/deploy/artifacts.sha256
            target/idl/*.json
          retention-days: 7

  per-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm ci --prefix experiments/per --ignore-scripts
      - run: npm audit --prefix experiments/per --omit=dev --audit-level high
      - run: npm --prefix experiments/per test

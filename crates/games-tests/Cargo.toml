[package]
name = "games-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
serde_json = "=1.0.151"
incentives = { path = "../../programs/incentives", features = ["no-entrypoint"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["token", "token_2022"] }
anchor-lang = "=1.2.0"
house = { path = "../../programs/house", features = ["no-entrypoint"] }
games = { path = "../../programs/games", features = ["no-entrypoint"] }
mock-vrf = { path = "../../tests/fixtures/mock-vrf", features = ["no-entrypoint"] }
ephemeral-vrf-sdk = { version = "=0.4.1", features = ["anchor-modern"] }
litesvm = "=0.15.2"
solana-account = "=4.3.0"
solana-clock = "=3.1.1"
solana-address = "=2.6.1"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-message = "=4.4.0"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = "=4.1.5"

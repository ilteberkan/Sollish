[package]
name = "vrf-recovery-tests"
version = "0.0.0"
edition = "2021"
publish = false

[features]
root-games-provider = ["dep:anchor-lang", "dep:games", "dep:house"]

[dependencies]
anchor-lang = { version = "=1.2.0", optional = true }
games = { path = "../../../programs/games", features = ["no-entrypoint"], optional = true }
house = { path = "../../../programs/house", features = ["no-entrypoint"], optional = true }

[[test]]
name = "root_games_provider"
path = "tests/root_games_provider.rs"
required-features = ["root-games-provider"]

[dev-dependencies]
serde_json = "=1.0.151"
vrf-recovery-experiment = { path = "../program", features = ["no-entrypoint"] }
solana-vrf.workspace = true
solana-vrf-api.workspace = true
bytemuck = "=1.25.2"
solana-curve25519 = "=3.0.0"
solana-compute-budget-interface = "=3.0.0"
curve25519-dalek = "=4.1.3"
solana-program = "=3.0.0"
litesvm = "=0.15.2"
solana-account = "=4.3.0"
solana-address = "=2.6.1"
solana-clock = "=3.1.1"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.4.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.5"

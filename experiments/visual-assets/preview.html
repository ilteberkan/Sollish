<!doctype html><html><head><meta charset="utf-8"><title>Fightkit candidate — isolated review</title><style>body{margin:0;background:#11131b;color:#eee;font:15px system-ui}header{position:absolute;left:28px;top:20px;z-index:2}p{color:#bbb}canvas{display:block;width:100vw;height:100vh}</style><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script></head><body><header><strong>FIGHTKIT V1 · ASSET REVIEW</strong><p>Left: pinned original · Right: candidate · Same anatomy, rig and authored clip</p></header><script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const scene=new T.Scene();scene.background=new T.Color('#141822');const renderer=new T.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.append(renderer.domElement);
const camera=new T.PerspectiveCamera(34,innerWidth/innerHeight,.05,100);const params=new URLSearchParams(location.search);camera.position.set(.3,1.25,params.get('back')?-4.9:4.9);camera.lookAt(0,1.02,0);
scene.add(new T.HemisphereLight('#c6def7','#242024',2.2));const key=new T.DirectionalLight('#fff1dc',4.1);key.position.set(-2,4,-3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-3;key.shadow.camera.right=3;key.shadow.camera.top=3;key.shadow.camera.bottom=-3;key.shadow.bias=-.0002;scene.add(key);const rim=new T.DirectionalLight('#87c5e6',2.8);rim.position.set(2,3,2);scene.add(rim);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:'#252a35',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);
const loader=new GLTFLoader();const models=[];const timings=[];for(const[url,x]of[['/original.glb',-.63],['/candidate.glb',.63]]){const start=performance.now();const g=await loader.loadAsync(url);g.scene.position.x=x;g.scene.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;n.frustumCulled=false;if(['RefereeShirt','RefereeTrousers'].includes(n.name)||(url.includes('candidate')&&['Trunks','Waistband','Boots'].includes(n.name)))n.visible=false;}});scene.add(g.scene);const mixer=new T.AnimationMixer(g.scene);const action=mixer.clipAction(g.animations.find(x=>x.name===(params.get('clip')||'Punch_Jab')));action.play();mixer.setTime(Number(params.get('time')||.055));models.push({g,mixer});timings.push(performance.now()-start);}
function draw(){renderer.render(scene,camera)}draw();window.review={ready:true,triangles:renderer.info.render.triangles,calls:renderer.info.render.calls,loadMs:timings,renderer:renderer.getContext().getParameter(renderer.getContext().getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL),pose(t){for(const{mixer}of models)mixer.setTime(t);draw();}};
</script></body></html>

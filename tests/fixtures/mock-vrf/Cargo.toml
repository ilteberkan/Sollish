[package]
name = "mock-vrf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
test-fixture = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "=1.2.0"
ephemeral-vrf-sdk = { version = "=0.4.1", features = ["anchor-modern"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[package]
name = "games"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "games"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "house/idl-build", "incentives/idl-build"]

[dependencies]
anchor-lang = "=1.2.0"
ephemeral-vrf-sdk = { version = "=0.4.1", features = ["anchor-modern"] }
house = { path = "../house", features = ["cpi"] }
game-math = { path = "../../crates/game-math" }

incentives = { path = "../incentives", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
